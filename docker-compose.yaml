services:
  booking-service:
    build: .
    container_name: booking-service
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=local
      - HTTP_ADDR=:8080
      - DATABASE_URL=postgres://postgres:password@db:5432/booking_service
      - JWT_SECRET=secret
      - HTTP_READ_TIMEOUT=15s
      - HTTP_WRITE_TIMEOUT=15s
      - HTTP_IDLE_TIMEOUT=60s
      - HTTP_SHUTDOWN_TIMEOUT=30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: booking_service
    volumes:
      - pgdata:/var/lib/postgresql/data
      # "./migrations/init.sql" - путь к миграциям БД
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d booking_service'"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - internal
networks:
  internal:
volumes:
  pgdata:
