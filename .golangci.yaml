version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unused
    - staticcheck

    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar

    - goconst
    - gocritic
    - whitespace

    - gosec

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
