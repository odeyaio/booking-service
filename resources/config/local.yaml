env: local

auth:
  dummy_login:
    enabled: true
    admin_user_id: 00000000-0000-0000-0000-000000000001
    user_user_id: 00000000-0000-0000-0000-000000000002

http:
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 30s

workers:
  slot_generator:
    interval: 6h
    window: 336h
